<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f0f8ff" />
  <title>MediScan AI Demo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #173047; background: #f0f8ff; }
    body { max-width: 680px; margin: 0 auto; padding: 2rem 1rem; }
    main { padding: clamp(1.25rem, 5vw, 2.5rem); border: 1px solid #d5e2ec; border-radius: 1rem; background: white; box-shadow: 0 1rem 3rem #17304712; }
    h1 { margin-top: 0; }
    label { display: block; margin: 1.5rem 0 .5rem; font-weight: 650; }
    input, button { max-width: 100%; font: inherit; }
    input { width: 100%; }
    button { margin-top: 1rem; padding: .7rem 1rem; border: 0; border-radius: .6rem; color: white; background: #155e75; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #result { min-height: 3rem; margin-top: 1rem; padding: .8rem; border-radius: .6rem; background: #f4f8fb; }
    .notice { padding: .9rem; border-left: 4px solid #c27a17; background: #fff8e9; }
    :focus-visible { outline: 3px solid #155e75; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>MediScan AI</h1>
    <p>This demo accepts a medicine-package image, but it does not currently have a verified analysis model.</p>
    <p class="notice"><strong>Safety:</strong> Do not use this demo to decide if a medicine is genuine, unexpired, or safe. Check the packaging and ask a licensed pharmacist or the manufacturer.</p>
    <form id="scan-form">
      <label for="file-input">Medicine-package image</label>
      <input id="file-input" name="file" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" required />
      <button id="scan-button" type="submit">Check model availability</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.getElementById('scan-form');
    const button = document.getElementById('scan-button');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = document.getElementById('file-input').files[0];
      if (!file) return;
      button.disabled = true;
      result.textContent = 'Checking…';
      try {
        const response = await fetch('/scan', { method: 'POST', body: new FormData(form) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'The image could not be checked.');
        result.textContent = 'Analysis complete.';
      } catch (error) {
        result.textContent = error instanceof TypeError
          ? 'Could not reach the server. Please try again later.'
          : error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
